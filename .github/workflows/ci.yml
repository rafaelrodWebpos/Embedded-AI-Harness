# Gates the host tier and lint only.
#
# A green tick here does NOT mean the bench works. The bench tests drive a
# live Raspberry Pi with DUTs plugged into it, and a GitHub-hosted runner cannot
# reach the bench. Those stay a pre-release step run against real hardware —
# see docs/Method/standards/testing.md.
name: host tests + lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:      # fork: lets the CI be run by hand

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches Raspberry Pi OS bookworm, so CI cannot pass on syntax the
          # bench would reject.
          python-version: '3.11'

      # Both versions are pinned. An unpinned ruff turns this gate red on a rule
      # selection nobody chose — the same `ruff check .` has reported both 36 and
      # 416 errors on this tree across versions. Bump deliberately, with the
      # fixes in the same commit.
      - run: pip install 'pytest==8.*' 'ruff==0.16.1'

      - name: Lint
        run: ruff check .

      # The host tier is stdlib-only apart from pytest. Do not install
      # requirements-dev.txt here: it pulls smbus2 and paho-mqtt, which only the
      # Pi needs, and a failure to build them would look like a test failure.
      - name: Host tests
        run: pytest pytest/host/ -q

  # Fork (rafaelrodWebpos): public repo, so the fork's own commits are scanned for
  # secrets. Only db6a093..HEAD — the upstream history is upstream's to judge.
  secret-scan:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      FORK_BASE: db6a093
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pinned gitleaks
        run: |
          curl -sSfL --retry 3 --retry-all-errors --retry-delay 10 -o gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gl.tgz" | sha256sum -c -
          tar xzf gl.tgz gitleaks
      - name: Scan the fork's commits
        run: ./gitleaks git --redact --no-banner --exit-code 1 --log-opts="${FORK_BASE}..HEAD" .
